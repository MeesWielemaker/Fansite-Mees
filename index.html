<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="banner">
      <img src="images/proost.jpeg" alt="Banner" />
      <h1 id="titel">bier!</h1>
    </div>

    <div class="container">
      <div class="header"><h2 id="knop">Wat is bier?</h2></div>

      <div class="content">
        <h3 style="font-style: italic">
          Bier is een drank die wordt gemaakt van water, graan, hop en gist.
          <br />Het heeft vaak een bittere smaak en bevat meestal alcohol.<br />
          Bier bestaat al heel lang.
        </h3>
      </div>
      <div class="footer">
        <h4>Hier onder staan nog een paar van mijn favoriete bieren.</h4>
      </div>
    </div>
    <div id="foto-groep">
      <a href="https://chouffe.com/nl-nl"
        ><img class="chouffe" src="images/choufe.jpg" alt="choufe link"
      /></a>
      <a href="https://www.hetanker.be"
        ><img class="carolus" src="images/carolus.jpg" alt="carolus link"
      /></a>
      <a href="https://www.stellaartois.com/nl_be/"
        ><img class="stella" src="images/stella.jpg" alt="stella link"
      /></a>
      <a href="https://www.hertogjan.nl"
        ><img class="hertog" src="images/hertog.jpg" alt="hertog link"
      /></a>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <h2>Ben je 18 jaar of ouder?</h2>
        <button id="ja-button">Ja</button>
        <button id="nee-button">Nee</button>
      </div>
    </div>
  </body>
</html>
